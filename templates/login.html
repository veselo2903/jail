<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jail — вход</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css', v=VERSION) }}">
<link rel="stylesheet" href="{{ url_for('static', filename='entry.css', v=VERSION) }}">
</head>
<body class="login-page">
<div class="box">
  <div class="head">
    <div class="sub">Обувное производство · выберите свою роль</div>
  </div>

  <a class="role" href="{{ url_for('login_as', role='sklad') }}">
    <span><span class="t">Склад</span><span class="d">Отвечает на заявки, передаёт материалы, готовит партии</span></span>
    <span class="go">→</span>
  </a>
  <a class="role" href="{{ url_for('login_as', role='proizv') }}">
    <span><span class="t">Производство</span><span class="d">Видит задания, записывает работу и готовые пары</span></span>
    <span class="go">→</span>
  </a>
  <a class="role" href="{{ url_for('login_as', role='director') }}">
    <span><span class="t">Директор</span><span class="d">Создаёт заказы, назначает расценки, учитывает зарплату и затраты</span></span>
    <span class="go">→</span>
  </a>

  {% if enable_web_updates %}
  <div class="foot"><a href="{{ url_for('update') }}">Обновление системы</a></div>
  {% endif %}
</div>
</body>
</html>
