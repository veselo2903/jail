<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jail — вход</title>
<style>
:root{--blue:#2563eb;--blue-d:#1d4ed8;--ink:#16202b;--muted:#64748b;--line:#e0e7ef}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:#eef2f6;color:var(--ink);display:flex;min-height:100vh;
  align-items:center;justify-content:center;padding:20px}
.box{width:380px;max-width:100%}
.head{text-align:center;margin-bottom:22px}
.sub{color:var(--muted);margin-top:8px;font-size:14px}
a.role{display:flex;align-items:center;justify-content:space-between;gap:14px;
  background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px 17px;
  margin-bottom:11px;text-decoration:none;
  box-shadow:0 1px 2px rgba(16,32,43,.05),0 6px 20px rgba(16,32,43,.05);
  transition:border-color .12s,transform .05s}
a.role:hover{border-color:#b9c7d6;transform:translateY(-1px)}
a.role:active{transform:translateY(0)}
.role .t{display:block;font-size:17px;font-weight:700;color:var(--ink)}
.role .d{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:3px}
.role .go{flex:none;color:var(--blue);font-size:22px;font-weight:700;text-decoration:none}
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:16px;
  color:#94a3b8;font-size:12px}
.foot a{color:var(--muted);text-decoration:none;font-weight:600}
.foot a:hover{color:var(--blue)}
</style>
</head>
<body>
<div class="box">
  <div class="head">
    <div class="sub">Учёт передачи и приёмки · выберите роль</div>
  </div>

  <a class="role" href="{{ url_for('login_as', role='sklad') }}">
    <span><span class="t">Склад</span><span class="d">Создаёт заявки, ведёт справочники, видит расхождения</span></span>
    <span class="go">→</span>
  </a>
  <a class="role" href="{{ url_for('login_as', role='proizv') }}">
    <span><span class="t">Производство</span><span class="d">Принимает партии, оформляет возврат готовой обуви</span></span>
    <span class="go">→</span>
  </a>
  <a class="role" href="{{ url_for('login_as', role='director') }}">
    <span><span class="t">Директор</span><span class="d">Видит всё: заявки, справочники, расхождения</span></span>
    <span class="go">→</span>
  </a>

  {% if enable_web_updates %}
  <div class="foot"><a href="{{ url_for('update') }}">Обновление системы</a></div>
  {% endif %}
</div>
</body>
</html>
