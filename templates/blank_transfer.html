{% extends "base.html" %}
{% block title %}Передача без заявки — jail{% endblock %}
{% block content %}
<div class="card">
  <h3>Добавить пары</h3>
  <form method="post" action="{{ url_for('docs_collect_blank') }}" class="grid">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="line_kind" value="pair">
    <div><label>Заказчик</label><select name="customer_id" required>{% for c in customers %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></div>
    <div><label>Модель</label><select name="model_id" required>{% for m in models %}<option value="{{ m.id }}">{{ m.name }}</option>{% endfor %}</select></div>
    {% include '_operation_choices.html' %}
    <div><label>Пары</label><input name="pairs" type="number" min="1" inputmode="numeric" required></div>
    <button class="btn block" type="submit">Создать передачу с парами</button>
  </form>
</div>
<div class="card">
  <h3>Добавить материал</h3>
  <form method="post" action="{{ url_for('docs_collect_blank') }}" class="grid">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="line_kind" value="material">
    <div><label>Материал</label><input name="item" required></div>
    <div><label>Количество</label><input name="qty" type="number" min="1" inputmode="numeric" required></div>
    <div><label>Единица</label><select name="unit" required>{% for k,v in UNITS.items() %}<option value="{{ k }}">{{ v }}</option>{% endfor %}</select></div>
    <button class="btn grey block" type="submit">Создать передачу с материалом</button>
  </form>
</div>
<a class="btn grey" href="{{ url_for('docs_collect') }}">Назад</a>
{% endblock %}
