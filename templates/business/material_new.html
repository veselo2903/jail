{% extends 'base.html' %}{% from 'business/_macros.html' import hidden,field with context %}{% block title %}Новый материал{% endblock %}{% block content %}<div class="biz-page"><header class="biz-header"><h2>Новый материал</h2><a class="btn grey" data-discard-draft href="{{ url_for('business.inventory') }}">← К материалам</a></header><form class="card biz-form" method="post">{{ hidden() }}{{ field('name','Название материала') }}<label class="biz-field"><span>Единица измерения</span><select name="unit" required>{% for key,title in UNITS.items() %}<option value="{{ key }}">{{ title }}</option>{% endfor %}<option value="m">м</option></select></label><button class="btn green block">Сохранить материал</button></form></div>{% endblock %}
