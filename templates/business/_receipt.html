{% from 'business/_macros.html' import hidden,field with context %}
{% macro receipt_row() %}<div class="biz-receipt-row"><label class="biz-field"><span>Материал</span><select name="material_id"><option value="">Выберите материал</option>{% for m in materials %}<option value="{{ m.id }}" data-unit="{{ UNITS.get(m.unit,m.unit) }}">{{ m.name }} · {{ UNITS.get(m.unit,m.unit) }}</option>{% endfor %}</select></label><label class="biz-field"><span>Количество</span><input name="qty" inputmode="decimal"></label><label class="biz-field"><span>Кто предоставил</span><select name="owner_customer_id"><option value="">Куплен предприятием</option>{% for c in customers %}<option value="{{ c.id }}">Заказчик: {{ c.name }}</option>{% endfor %}</select></label><label class="biz-field" data-cost><span>Стоимость всей позиции, ₽</span><input name="cost" inputmode="decimal" placeholder="0 для бесплатного"></label><button class="btn danger icon" type="button" data-receipt-remove title="Убрать строку">×</button><a class="btn grey sm" data-section-hop data-picker="material_id" href="{{ url_for('business.material_new') }}">Добавить новое название</a></div>{% endmacro %}
<form class="biz-form" method="post" id="inventory-receipt-form">{{ hidden('material_move') }}<input type="hidden" name="kind" value="receipt"><div data-receipt-rows>{{ receipt_row() }}</div><button class="btn grey block dashed" type="button" data-receipt-add>+ Ещё материал</button><div class="biz-grid">{{ field('occurred_on','Дата поступления',business_today,'date') }}{{ field('note','Примечание','','text',false) }}</div><button class="btn green block">Записать поступление</button></form><template id="receipt-row-template">{{ receipt_row() }}</template>
<script>
(function(){
 const form=document.getElementById('inventory-receipt-form'),rows=form.querySelector('[data-receipt-rows]'),template=document.getElementById('receipt-row-template');
 function sync(){rows.querySelectorAll('.biz-receipt-row').forEach(row=>{const own=!row.querySelector('[name=owner_customer_id]').value;row.querySelector('[data-cost]').hidden=!own;row.querySelector('[data-cost] input').disabled=!own})}
 form.querySelector('[data-receipt-add]').addEventListener('click',()=>{rows.appendChild(template.content.cloneNode(true));sync()});
 form.addEventListener('change',sync);
 form.addEventListener('click',event=>{if(event.target.closest('[data-receipt-remove]')){const row=event.target.closest('.biz-receipt-row');if(rows.children.length>1)row.remove();else row.querySelectorAll('input,select').forEach(el=>el.value='');sync();form.dispatchEvent(new Event('input',{bubbles:true}))}});
 window.jailInventoryRestore=function(fields){while(rows.children.length>1)rows.lastElementChild.remove();for(let n=1;n<(fields.material_id?.length||1);n++)form.querySelector('[data-receipt-add]').click();Object.entries(fields).forEach(([name,values])=>Array.from(form.elements).filter(el=>el.name===name).forEach((el,n)=>{if(!['token','csrf_token'].includes(name))el.value=values[n]||''}));sync()};
 const retry={{ retry_fields|tojson }};if(retry&&retry.kind?.[0]==='receipt')window.jailInventoryRestore(retry);
 const selected=new URLSearchParams(location.search).get('material');if(selected&&!retry)rows.querySelector('[name=material_id]').value=selected;
 sync();
})();
</script>
